# Temporary: runs the macOS checks and idle measurements for the idle-scan change on a
# GitHub-hosted Mac. Remove once the results are recorded.
name: macOS checks (temporary)
on:
  push:
    branches: [claude/determined-pascal-ep3bxh]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          mkdir -p /tmp/logs
          sw_vers; uname -m; xcode-select -p; xcodebuild -version; swift --version
          mdutil -a -s || true
      - name: swift test
        run: swift test --scratch-path /tmp/screenshot-renamer-tests 2>&1 | tee /tmp/logs/swift-test.log
      - name: scripts/test-watcher.sh
        if: success() || failure()
        run: ./scripts/test-watcher.sh 2>&1 | tee /tmp/logs/test-watcher.log
      - name: scripts/test-ui.sh
        if: success() || failure()
        run: ./scripts/test-ui.sh 2>&1 | tee /tmp/logs/test-ui.log
      - name: Before/after idle measurements
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 15
        run: .github/macos-checks/measure.sh 2>&1 | tee /tmp/logs/measure.log
      - name: Summary
        if: always()
        run: |
          {
            echo '## macOS checks'
            echo '```'
            grep -hE "Executed [0-9]+ tests|with [0-9]+ failures|error: |' failed \(" /tmp/logs/swift-test.log | tail -25 || true
            grep -hE "^(PASS|FAIL)" /tmp/logs/test-watcher.log | tail -3 || true
            grep -hE "UI verification" /tmp/logs/test-ui.log || true
            grep -hE "^(RESULT|SPOTLIGHT|SCAN|APP)" /tmp/logs/measure.log || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-check-logs
          path: /tmp/logs
          retention-days: 7
